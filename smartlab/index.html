<title>Insight Smart Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   INSIGHT SMART LAB — instrument-console design system
   Dark-committed by design: the stage renders fields, orbitals and
   traces with additive (phosphor) blending, which requires a dark
   ground. Every colour is painted explicitly so the page holds on
   any host background.
   ============================================================ */
:root{
  --ink-950:#05080F; --ink-900:#080C16; --ink-850:#0B111E;
  --ink-800:#0F1724; --ink-750:#141D2E; --ink-700:#1A2439;
  --line:#212D46; --line-soft:#172034;

  --text:#E7EDFB; --text-2:#98A6C6; --text-3:#63729A;

  --phys:#3DD6F5; --chem:#FFAE4C; --bio:#FF6B9D;
  --accent:var(--phys);
  --ok:#4ADE80; --warn:#FBBF24; --crit:#FB7185;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r1:4px; --r2:8px; --r3:12px;

  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --cond:'IBM Plex Sans Condensed','IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --math:Georgia,'Times New Roman',serif;
}
[data-subject="physics"]{--accent:var(--phys);}
[data-subject="chemistry"]{--accent:var(--chem);}
[data-subject="biology"]{--accent:var(--bio);}

*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(61,214,245,.055), transparent 62%),
    linear-gradient(180deg,var(--ink-900),var(--ink-950));
  background-attachment:fixed;
  color:var(--text);
  font:400 14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
}
::selection{background:color-mix(in oklab,var(--accent) 35%,transparent);color:#fff;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r1);}
h1,h2,h3,h4{margin:0;font-family:var(--cond);font-weight:700;text-wrap:balance;letter-spacing:-.01em;}
p{margin:0;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
button:disabled{cursor:default;}
canvas{display:block;}
table{border-collapse:collapse;}

.eyebrow{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-3);}

/* ---------- app frame ---------- */
.app{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s4);
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(15,23,36,.94),rgba(11,17,30,.74));
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;
}
.brand{display:flex;align-items:center;gap:var(--s3);min-width:0;}
.brand-mark{width:30px;height:30px;flex:none;border-radius:7px;
  background:linear-gradient(145deg,var(--ink-700),var(--ink-850));
  border:1px solid var(--line);display:grid;place-items:center;}
.brand-mark span{width:11px;height:11px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px color-mix(in oklab,var(--accent) 75%,transparent);
  transition:background .4s ease,box-shadow .4s ease;}
.brand-name{font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.1;}
.brand-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);}
.topbar-spacer{flex:1;}
.exam-tags{display:flex;gap:6px;}
.tag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);
  color:var(--text-2);background:var(--ink-850);white-space:nowrap;}
.tag.on{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 45%,var(--line));
  background:color-mix(in oklab,var(--accent) 11%,var(--ink-850));}
.kbd-hint{font-family:var(--mono);font-size:9.5px;color:var(--text-3);white-space:nowrap;}
.kbd-hint b{color:var(--text-2);font-weight:500;background:var(--ink-800);
  border:1px solid var(--line);border-radius:3px;padding:1px 4px;margin:0 2px;}

.body{flex:1;display:grid;grid-template-columns:238px minmax(0,1fr);min-height:0;}

/* ---------- left rail ---------- */
.rail{border-right:1px solid var(--line-soft);padding:var(--s4) var(--s3) var(--s6);
  display:flex;flex-direction:column;gap:var(--s5);
  position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow:auto;}
.rail-group{display:flex;flex-direction:column;gap:var(--s3);}
.rail-head{display:flex;align-items:center;gap:7px;padding-left:2px;}
.rail-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.rail-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);}
.rail-count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3);}
.rail-chapter{display:flex;flex-direction:column;gap:3px;}
.rail-chapter-name{font-size:10.5px;color:var(--text-3);padding:0 0 2px 10px;
  border-left:1px solid var(--line);margin-left:3px;}
.navbtn{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--r2);border:1px solid transparent;color:var(--text-2);
  transition:background .16s,border-color .16s,color .16s;}
.navbtn:hover{background:var(--ink-800);color:var(--text);}
.navbtn strong{font-weight:600;font-size:12.5px;line-height:1.3;letter-spacing:-.005em;}
.navbtn em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--text-3);}
.navbtn[aria-current="true"]{background:color-mix(in oklab,var(--nav) 13%,var(--ink-850));
  border-color:color-mix(in oklab,var(--nav) 42%,transparent);color:var(--text);}
.navbtn[aria-current="true"] em{color:var(--nav);}

/* ---------- main ---------- */
.main{padding:var(--s5) var(--s5) var(--s7);min-width:0;display:flex;flex-direction:column;gap:var(--s5);}
.expo{display:flex;flex-direction:column;gap:var(--s3);max-width:76ch;}
.expo-tags{display:flex;flex-wrap:wrap;gap:6px;}
.expo h1{font-size:clamp(22px,3.1vw,30px);line-height:1.12;}
.expo-lede{color:var(--text-2);font-size:14.5px;line-height:1.6;}
.expo-lede b{color:var(--text);font-weight:600;}

.console{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:var(--s4);align-items:start;}
.col{display:flex;flex-direction:column;gap:var(--s4);min-width:0;}

.panel{background:linear-gradient(180deg,var(--ink-800),var(--ink-850));
  border:1px solid var(--line-soft);border-radius:var(--r3);
  display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.panel-head{display:flex;align-items:center;gap:var(--s2);padding:9px var(--s3);
  border-bottom:1px solid var(--line-soft);}
.panel-head .eyebrow{color:var(--text-2);}
.panel-head .spacer{flex:1;}
.panel-body{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s3);min-width:0;}
.ptools{display:flex;gap:5px;}

/* ---------- stage ---------- */
.stage{position:relative;background:var(--ink-950);border-bottom:1px solid var(--line-soft);
  aspect-ratio:16/9;width:100%;}
.stage canvas{width:100%;height:100%;touch-action:none;}
.stagepanel[data-d3="1"] .stage canvas{cursor:grab;}
.stagepanel[data-d3="1"] .stage canvas:active{cursor:grabbing;}
.stage-hint{position:absolute;left:10px;bottom:9px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;color:var(--text-3);background:rgba(5,8,15,.74);
  padding:3px 7px;border-radius:var(--r1);pointer-events:none;max-width:calc(100% - 20px);}
.stagepanel:fullscreen{background:var(--ink-950);border-radius:0;}
.stagepanel:fullscreen .stage{aspect-ratio:auto;height:calc(100vh - 108px);}
.transport{display:flex;align-items:center;gap:6px;padding:8px var(--s3);flex-wrap:wrap;}
.speed{display:flex;align-items:center;gap:7px;margin-left:auto;}
.speed input{width:84px;}
.speed span{font-family:var(--mono);font-size:10.5px;color:var(--text-3);white-space:nowrap;}

/* ---------- buttons ---------- */
.mbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r2);
  border:1px solid var(--line);background:var(--ink-750);
  font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--text-2);
  transition:border-color .15s,color .15s,background .15s;}
.mbtn:hover:not(:disabled){color:var(--text);border-color:color-mix(in oklab,var(--accent) 48%,var(--line));}
.mbtn.primary{background:color-mix(in oklab,var(--accent) 16%,var(--ink-750));
  border-color:color-mix(in oklab,var(--accent) 50%,transparent);color:var(--text);}
.mbtn.tiny{padding:3px 8px;font-size:10px;}
.mbtn.wide{width:100%;justify-content:center;}
.mbtn.preset{border-radius:999px;background:var(--ink-850);font-family:var(--sans);
  font-size:11px;letter-spacing:0;padding:5px 10px;}
.mbtn.preset:hover{background:color-mix(in oklab,var(--accent) 9%,var(--ink-850));}

/* ---------- controls ---------- */
.ctlgroup{display:flex;flex-direction:column;gap:11px;}
.ctlgroup + .ctlgroup{padding-top:var(--s3);border-top:1px dashed var(--line-soft);}
.ctlgroup-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-3);}
.ctl{display:flex;flex-direction:column;gap:5px;}
.ctl-top{display:flex;align-items:baseline;gap:var(--s2);}
.ctl-label{font-size:12px;color:var(--text-2);flex:1;min-width:0;}
.ctl-label i{font-family:var(--math);font-style:italic;color:var(--text);font-size:13px;}
.ctl-val{font-family:var(--mono);font-size:11.5px;color:var(--accent);
  font-variant-numeric:tabular-nums;white-space:nowrap;padding:1px 4px;border-radius:var(--r1);
  border:1px solid transparent;transition:border-color .15s,background .15s;}
.ctl-val:hover{border-color:var(--line);background:var(--ink-900);}
.ctl-val small{color:var(--text-3);margin-left:3px;}
.ctl-num{width:96px;font-family:var(--mono);font-size:11.5px;color:var(--text);
  background:var(--ink-900);border:1px solid color-mix(in oklab,var(--accent) 50%,var(--line));
  border-radius:var(--r1);padding:2px 5px;}
.presets{display:flex;flex-wrap:wrap;gap:5px;}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(90deg,color-mix(in oklab,var(--accent) 70%,transparent) var(--fill,50%),var(--ink-700) var(--fill,50%));}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--ink-700);}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:color-mix(in oklab,var(--accent) 70%,transparent);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5px;
  border-radius:50%;background:var(--text);border:2px solid var(--ink-850);
  box-shadow:0 0 0 1px color-mix(in oklab,var(--accent) 60%,transparent);}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
  background:var(--text);border:2px solid var(--ink-850);}

.seg{display:flex;gap:3px;background:var(--ink-900);padding:3px;border-radius:var(--r2);
  border:1px solid var(--line-soft);}
.seg.seg-wrap{flex-wrap:wrap;}
.seg button{flex:1 1 auto;padding:5px 7px;border-radius:5px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.02em;color:var(--text-3);white-space:nowrap;
  transition:background .15s,color .15s;}
.seg button:hover{color:var(--text-2);}
.seg button[aria-pressed="true"]{background:color-mix(in oklab,var(--accent) 20%,var(--ink-750));color:var(--text);}
.seg.seg-wrap button{flex:1 1 44%;}

.switch{display:flex;align-items:center;gap:var(--s2);cursor:pointer;padding:2px 0;}
.switch-track{width:32px;height:18px;border-radius:999px;background:var(--ink-700);
  border:1px solid var(--line);position:relative;flex:none;transition:background .18s;}
.switch-track::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
  border-radius:50%;background:var(--text-3);transition:transform .18s,background .18s;}
.switch input{position:absolute;opacity:0;width:0;height:0;}
.switch input:checked + .switch-track{background:color-mix(in oklab,var(--accent) 30%,var(--ink-700));}
.switch input:checked + .switch-track::after{transform:translateX(14px);background:var(--accent);}
.switch input:focus-visible + .switch-track{outline:2px solid var(--accent);outline-offset:2px;}
.switch-label{font-size:12px;color:var(--text-2);}

/* ---------- readouts ---------- */
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;background:var(--line-soft);}
.ro{background:var(--ink-800);padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0;}
.ro-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ro-val{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text);
  font-variant-numeric:tabular-nums;line-height:1.25;}
.ro-val small{font-size:10px;font-weight:400;color:var(--text-2);margin-left:3px;}
.ro-hint{font-size:10.5px;color:var(--text-3);line-height:1.35;}
.ro[data-flag="accent"] .ro-val{color:var(--accent);}
.ro[data-flag="ok"] .ro-val{color:var(--ok);}
.ro[data-flag="warn"] .ro-val{color:var(--warn);}
.ro[data-flag="crit"] .ro-val{color:var(--crit);}

/* ---------- equation ---------- */
.eqwrap{display:flex;flex-direction:column;gap:10px;}
.eq{font-family:var(--math);font-size:17px;line-height:1.95;color:var(--text);
  overflow-x:auto;padding-bottom:2px;white-space:nowrap;}
.eq i{font-style:italic;}
.eq .op{color:var(--text-2);font-style:normal;padding:0 .18em;}
.eq .num{font-family:var(--mono);font-style:normal;font-size:13px;color:var(--accent);
  background:color-mix(in oklab,var(--accent) 12%,transparent);padding:1px 5px;border-radius:var(--r1);}
.eq .unit{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--text-3);margin-left:2px;}
.eq sub,.eq sup{font-size:.62em;}
.eq .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;
  margin:0 .25em;line-height:1.25;}
.eq .frac > span:first-child{border-bottom:1px solid var(--text-2);padding:0 .35em;}
.eq .frac > span:last-child{padding:0 .35em;}
.eq-note{font-size:12px;color:var(--text-3);line-height:1.55;white-space:normal;}
.eq-note b{color:var(--text-2);font-weight:600;}

/* ---------- plots ---------- */
.plot{position:relative;width:100%;aspect-ratio:16/7;background:var(--ink-950);
  border-radius:var(--r2);overflow:hidden;}
.plot canvas{width:100%;height:100%;cursor:crosshair;}
.tooltip{position:absolute;z-index:5;pointer-events:none;
  background:rgba(8,12,22,.95);border:1px solid var(--line);border-radius:var(--r2);
  padding:7px 9px;display:flex;flex-direction:column;gap:3px;min-width:118px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);}
.tooltip .tr{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;}
.tooltip .tr i{width:8px;height:8px;border-radius:2px;flex:none;}
.tooltip .tr b{font-weight:400;color:var(--text-3);flex:1;}
.tooltip .tr u{text-decoration:none;color:var(--text);font-variant-numeric:tabular-nums;}
.legend{display:flex;flex-wrap:wrap;gap:var(--s3);padding-top:2px;}
.lg{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--text-2);}
.lg i{width:14px;height:3px;border-radius:2px;flex:none;display:block;}

/* ---------- walkthrough ---------- */
.wt-progress{display:flex;gap:3px;margin-bottom:2px;}
.wt-progress span{height:2px;flex:1;border-radius:2px;background:var(--ink-700);transition:background .25s;}
.wt-progress span.done{background:color-mix(in oklab,var(--accent) 70%,transparent);}
.wt-step{display:flex;flex-direction:column;gap:8px;}
.wt-step h4{font-size:14.5px;line-height:1.3;}
.wt-step p{font-size:12.5px;line-height:1.6;color:var(--text-2);}
.wt-ask{border-left:2px solid color-mix(in oklab,var(--accent) 60%,transparent);
  padding:7px 0 7px 11px;font-size:12.5px;line-height:1.55;color:var(--text);
  background:color-mix(in oklab,var(--accent) 6%,transparent);border-radius:0 var(--r1) var(--r1) 0;}
.wt-ask b{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:3px;font-weight:500;}
.wt-reveal{font-size:12.5px;line-height:1.6;color:var(--text-2);}
.wt-reveal b{color:var(--text);font-weight:600;}
.wt-nav{display:flex;align-items:center;gap:var(--s2);padding-top:var(--s1);}
.wt-count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3);}

/* ---------- quiz ---------- */
.quiz-q{font-size:13px;line-height:1.55;color:var(--text);}
.quiz-opts{display:flex;flex-direction:column;gap:5px;}
.quiz-opt{text-align:left;padding:7px 10px;border-radius:var(--r2);
  border:1px solid var(--line-soft);background:var(--ink-850);
  font-size:12px;line-height:1.45;color:var(--text-2);
  transition:border-color .15s,color .15s,background .15s;}
.quiz-opt:hover:not(:disabled){border-color:color-mix(in oklab,var(--accent) 45%,var(--line));color:var(--text);}
.quiz-opt[data-state="right"]{border-color:color-mix(in oklab,var(--ok) 60%,transparent);
  background:color-mix(in oklab,var(--ok) 12%,var(--ink-850));color:var(--text);}
.quiz-opt[data-state="wrong"]{border-color:color-mix(in oklab,var(--crit) 55%,transparent);
  background:color-mix(in oklab,var(--crit) 10%,var(--ink-850));color:var(--text);}
.quiz-why{font-size:12px;line-height:1.6;color:var(--text-2);
  border-left:2px solid var(--line);padding-left:10px;}
.quiz-why b{color:var(--text);font-weight:600;}

/* ---------- lab notebook ---------- */
.log-empty{font-size:11.5px;line-height:1.55;color:var(--text-3);}
.logscroll{max-height:190px;overflow:auto;margin:-4px -2px;}
.logtable{width:100%;font-family:var(--mono);font-size:10px;font-variant-numeric:tabular-nums;}
.logtable th{position:sticky;top:0;background:var(--ink-800);text-align:left;
  font-weight:500;color:var(--text-3);padding:5px 6px;white-space:nowrap;
  border-bottom:1px solid var(--line);letter-spacing:.02em;}
.logtable td{padding:4px 6px;color:var(--text-2);white-space:nowrap;
  border-bottom:1px solid var(--line-soft);}
.logtable td.logn{color:var(--text-3);}
.logtable tr:hover td{background:var(--ink-800);color:var(--text);}

/* ---------- notes ---------- */
.notes{font-size:13px;line-height:1.7;color:var(--text-2);display:flex;flex-direction:column;gap:11px;}
.notes b{color:var(--text);font-weight:600;}
.notes .pyq{border:1px solid var(--line-soft);border-radius:var(--r2);padding:11px var(--s3);
  background:var(--ink-850);display:flex;flex-direction:column;gap:5px;}
.notes .pyq em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;}
.notes li::marker{color:var(--text-3);}

/* ---------- responsive ---------- */
@media (max-width:1120px){ .console{grid-template-columns:1fr;} }
@media (max-width:860px){
  .body{grid-template-columns:1fr;}
  .rail{position:static;max-height:none;overflow:visible;border-right:none;
    border-bottom:1px solid var(--line-soft);flex-direction:row;gap:var(--s4);
    padding:var(--s3) var(--s4);overflow-x:auto;}
  .rail-group{min-width:210px;}
  .main{padding:var(--s4) var(--s4) var(--s6);gap:var(--s4);}
  .stage{aspect-ratio:4/3;}
  .kbd-hint{display:none;}
}
@media (max-width:440px){
  .topbar{padding:10px var(--s3);gap:var(--s2);}
  .exam-tags{display:none;}
  .main{padding-inline:var(--s3);}
  .stage{aspect-ratio:1/1;}
